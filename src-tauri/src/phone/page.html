<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chatelle</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        font-family: system-ui, sans-serif;
        background: #2c2b29;
        color: #fbfbfb;
      }
      #rec {
        width: 60vmin;
        height: 60vmin;
        border-radius: 50%;
        border: 0;
        font-size: 8vmin;
        color: #fff;
        background: #d97757;
        touch-action: manipulation;
      }
      /* Recording: the darker brand orange with a pulsing ring. */
      #rec.on {
        background: #c96442;
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          box-shadow: 0 0 0 4vmin rgba(217, 119, 87, 0.3);
        }
      }
      #rec:disabled {
        background: #4a4845;
        animation: none;
      }
      #status {
        font-size: 5vmin;
        text-align: center;
        padding: 0 16px;
      }
    </style>
  </head>
  <body>
    <button id="rec" disabled></button>
    <div id="status"></div>
    <script>
      "use strict";
      const TOKEN = __TOKEN__;
      const S = __STRINGS__;
      const btn = document.getElementById("rec");
      const statusEl = document.getElementById("status");
      let ws = null;
      let state = "idle";
      let wakeLock = null;
      // A newer page took the connection (close code 4000). Wait for a tap.
      let replaced = false;
      // The link's key is outdated (a new QR code was made). Stop for good.
      let oldLink = false;
      // Shown until the microphone starts.
      let micError = null;
      // The running microphone: { stream, ctx }.
      let mic = null;
      // The microphone start in progress, so a double tap starts it only once.
      let micStarting = null;
      // A tap is being handled. The button stays disabled, so it sends one toggle.
      let busy = false;
      // True once audio has gone out on the current WebSocket. The app counts the
      // phone as connected only when its audio arrives.
      let audioSent = false;
      let audioWaiters = [];

      function render() {
        const connected = ws && ws.readyState === WebSocket.OPEN;
        btn.textContent = state === "recording" ? S.stop : S.record;
        btn.classList.toggle("on", state === "recording");
        btn.disabled =
          oldLink ||
          (!replaced && (!connected || state === "transcribing" || busy));
        if (oldLink) statusEl.textContent = S.oldLink;
        else if (replaced) statusEl.textContent = S.replaced;
        else if (!connected) statusEl.textContent = S.reconnecting;
        else if (micError) statusEl.textContent = micError;
        else if (state === "recording") statusEl.textContent = S.recording;
        else if (state === "transcribing")
          statusEl.textContent = S.transcribing;
        else statusEl.textContent = S.connected;
      }

      function connect() {
        const sock = new WebSocket(
          "wss://" + location.host + "/ws?t=" + encodeURIComponent(TOKEN),
        );
        ws = sock;
        audioSent = false;
        sock.binaryType = "arraybuffer";
        sock.onopen = render;
        sock.onmessage = (e) => {
          if (typeof e.data !== "string") return;
          try {
            const m = JSON.parse(e.data);
            if (m.type === "state") {
              state = m.state;
              render();
            }
          } catch (_) {
            /* ignore bad message */
          }
        };
        sock.onclose = (e) => {
          if (sock !== ws) return;
          if (e.code === 4000) {
            // Another tab is the phone now. Reconnecting on our own would take the
            // connection back, and the two tabs would fight forever.
            replaced = true;
            render();
            return;
          }
          render();
          // A hidden page stays disconnected until it is shown again.
          if (document.visibilityState !== "visible") return;
          checkLinkThenReconnect(sock);
        };
        sock.onerror = () => sock.close();
      }

      // A refused connection looks the same as a dropped one. Ask the computer
      // whether this link is still current: if not (403), turn the microphone
      // off, stop retrying and ask for the new QR code. Otherwise retry.
      async function checkLinkThenReconnect(sock) {
        try {
          const res = await fetch("/ping?t=" + encodeURIComponent(TOKEN), {
            cache: "no-store",
          });
          if (res.status === 403) {
            oldLink = true;
            stopMic();
            render();
            return;
          }
        } catch (_) {
          /* computer unreachable: retry below */
        }
        setTimeout(() => {
          if (document.visibilityState === "visible" && ws === sock) connect();
        }, 2000);
      }

      function sendAudio(buffer) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(buffer);
        if (!audioSent) {
          audioSent = true;
          audioWaiters.splice(0).forEach((resolve) => resolve());
        }
      }

      // Resolves when audio has gone out on the current WebSocket, or after 3 s.
      function waitForAudio() {
        if (audioSent) return Promise.resolve();
        return new Promise((resolve) => {
          audioWaiters.push(resolve);
          setTimeout(resolve, 3000);
        });
      }

      // Runs in the audio thread. Resamples to 16 kHz (linear interpolation) and posts ~20 ms blocks.
      const WORKLET = `
class Pcm16 extends AudioWorkletProcessor {
  constructor() {
    super();
    this.step = sampleRate / 16000;
    this.pos = 0;
    this.prev = 0;
    this.out = new Int16Array(320);
    this.n = 0;
  }
  process(inputs) {
    const ch = inputs[0][0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      const cur = ch[i];
      while (this.pos < 1) {
        const v = this.prev + (cur - this.prev) * this.pos;
        const c = Math.max(-1, Math.min(1, v));
        this.out[this.n++] = c < 0 ? c * 32768 : c * 32767;
        if (this.n === this.out.length) {
          this.port.postMessage(this.out.slice().buffer);
          this.n = 0;
        }
        this.pos += this.step;
      }
      this.pos -= 1;
      this.prev = cur;
    }
    return true;
  }
}
registerProcessor("pcm16", Pcm16);
`;

      async function startMic() {
        let stream = null;
        let ctx = null;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              channelCount: 1,
            },
          });
          ctx = new AudioContext();
          const url = URL.createObjectURL(
            new Blob([WORKLET], { type: "text/javascript" }),
          );
          await ctx.audioWorklet.addModule(url);
          const node = new AudioWorkletNode(ctx, "pcm16");
          node.port.onmessage = (e) => sendAudio(e.data);
          ctx.createMediaStreamSource(stream).connect(node);
          // Chrome only runs nodes that lead to the speakers. The gain of 0 keeps
          // the worklet running and plays nothing.
          const mute = ctx.createGain();
          mute.gain.value = 0;
          node.connect(mute).connect(ctx.destination);
          if (ctx.state !== "running") await ctx.resume();
          mic = { stream, ctx };
        } catch (err) {
          if (stream) stream.getTracks().forEach((track) => track.stop());
          if (ctx) ctx.close().catch(() => {});
          throw err;
        }
      }

      function stopMic() {
        if (!mic) return;
        mic.stream.getTracks().forEach((track) => track.stop());
        mic.ctx.close().catch(() => {});
        mic = null;
      }

      // Starts the microphone if it is not running, or restarts it if Chrome ended
      // its track. Only one start runs at a time.
      function ensureMic() {
        const track = mic && mic.stream.getAudioTracks()[0];
        if (track && track.readyState !== "ended") return Promise.resolve();
        if (!micStarting) {
          stopMic();
          micStarting = startMic().finally(() => {
            micStarting = null;
          });
        }
        return micStarting;
      }

      async function resumeAudio() {
        if (mic && mic.ctx.state !== "running") {
          try {
            await mic.ctx.resume();
          } catch (_) {
            /* tried again on the next tap */
          }
        }
      }

      async function requestWakeLock() {
        try {
          if (navigator.wakeLock)
            wakeLock = await navigator.wakeLock.request("screen");
        } catch (_) {
          /* not critical */
        }
      }
      // Leaving the page (another app, the home screen, a locked screen, a
      // closed tab) turns the microphone off, so the phone never listens in the
      // background. A recording in progress is stopped first, so the words
      // already spoken are still typed. The next tap starts the microphone again.
      function releaseMic() {
        if (state === "recording" && ws && ws.readyState === WebSocket.OPEN)
          ws.send('{"type":"toggle"}');
        stopMic();
        // The next tap waits for fresh audio before it presses the button.
        audioSent = false;
        // Disconnect too, so Chatelle knows the phone is gone and records with
        // the computer's microphone instead.
        if (ws && ws.readyState <= WebSocket.OPEN) ws.close();
        if (wakeLock) {
          wakeLock.release().catch(() => {});
          wakeLock = null;
        }
      }
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState !== "visible") {
          releaseMic();
          return;
        }
        requestWakeLock();
        resumeAudio();
        if (
          !replaced &&
          !oldLink &&
          (!ws || ws.readyState >= WebSocket.CLOSING)
        ) {
          connect();
          render();
        }
      });
      window.addEventListener("pagehide", releaseMic);

      btn.addEventListener("click", async () => {
        if (replaced) {
          // This tap only takes the connection back; it does not start recording.
          replaced = false;
          connect();
          render();
          return;
        }
        if (busy) return;
        busy = true;
        render();
        try {
          try {
            await ensureMic();
            micError = null;
            // The page was left while the microphone was starting.
            if (document.visibilityState !== "visible") {
              stopMic();
              return;
            }
          } catch (err) {
            const blocked =
              err &&
              (err.name === "NotAllowedError" || err.name === "SecurityError");
            micError = blocked ? S.micDenied : S.micFailed;
            return;
          }
          await resumeAudio();
          requestWakeLock();
          // The app ignores a press until the phone's audio has arrived.
          await waitForAudio();
          if (ws && ws.readyState === WebSocket.OPEN)
            ws.send('{"type":"toggle"}');
        } finally {
          busy = false;
          render();
        }
      });

      render();
      connect();
    </script>
  </body>
</html>
