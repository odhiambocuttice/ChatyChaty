<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatelle</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; font-family: system-ui, sans-serif; background: #111; color: #eee;
  }
  #rec {
    width: 60vmin; height: 60vmin; border-radius: 50%; border: 0;
    font-size: 8vmin; color: #fff; background: #2f7d32; touch-action: manipulation;
  }
  #rec.on { background: #c62828; }
  #rec:disabled { background: #444; }
  #status { font-size: 5vmin; text-align: center; padding: 0 16px; }
</style>
</head>
<body>
<button id="rec" disabled></button>
<div id="status"></div>
<script>
"use strict";
const TOKEN = __TOKEN__;
const S = __STRINGS__;
const btn = document.getElementById("rec");
const statusEl = document.getElementById("status");
let ws = null;
let micReady = false;
let state = "idle";
let wakeLock = null;

function render() {
  const connected = ws && ws.readyState === WebSocket.OPEN;
  btn.textContent = state === "recording" ? S.stop : S.record;
  btn.classList.toggle("on", state === "recording");
  btn.disabled = !connected || state === "transcribing";
  if (!connected) statusEl.textContent = S.reconnecting;
  else if (state === "recording") statusEl.textContent = S.recording;
  else if (state === "transcribing") statusEl.textContent = S.transcribing;
  else statusEl.textContent = S.connected;
}

function connect() {
  ws = new WebSocket("wss://" + location.host + "/ws?t=" + encodeURIComponent(TOKEN));
  ws.binaryType = "arraybuffer";
  ws.onopen = render;
  ws.onmessage = (e) => {
    if (typeof e.data !== "string") return;
    try {
      const m = JSON.parse(e.data);
      if (m.type === "state") { state = m.state; render(); }
    } catch (_) { /* ignore bad message */ }
  };
  ws.onclose = () => { render(); setTimeout(connect, 2000); };
  ws.onerror = () => ws.close();
}

// Runs in the audio thread. Resamples to 16 kHz (linear interpolation) and posts ~20 ms blocks.
const WORKLET = `
class Pcm16 extends AudioWorkletProcessor {
  constructor() {
    super();
    this.step = sampleRate / 16000;
    this.pos = 0;
    this.prev = 0;
    this.out = new Int16Array(320);
    this.n = 0;
  }
  process(inputs) {
    const ch = inputs[0][0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      const cur = ch[i];
      while (this.pos < 1) {
        const v = this.prev + (cur - this.prev) * this.pos;
        const c = Math.max(-1, Math.min(1, v));
        this.out[this.n++] = c < 0 ? c * 32768 : c * 32767;
        if (this.n === this.out.length) {
          this.port.postMessage(this.out.slice().buffer);
          this.n = 0;
        }
        this.pos += this.step;
      }
      this.pos -= 1;
      this.prev = cur;
    }
    return true;
  }
}
registerProcessor("pcm16", Pcm16);
`;

async function startMic() {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 },
  });
  const ctx = new AudioContext();
  const url = URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" }));
  await ctx.audioWorklet.addModule(url);
  const node = new AudioWorkletNode(ctx, "pcm16");
  node.port.onmessage = (e) => {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(e.data);
  };
  ctx.createMediaStreamSource(stream).connect(node);
  if (ctx.state === "suspended") await ctx.resume();
}

async function requestWakeLock() {
  try {
    if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen");
  } catch (_) { /* not critical */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") requestWakeLock();
});

btn.addEventListener("click", async () => {
  if (!micReady) {
    try {
      await startMic();
      micReady = true;
      requestWakeLock();
    } catch (_) {
      statusEl.textContent = S.micDenied;
      return;
    }
  }
  if (ws && ws.readyState === WebSocket.OPEN) ws.send('{"type":"toggle"}');
});

render();
connect();
</script>
</body>
</html>
